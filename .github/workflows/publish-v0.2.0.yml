name: Publish v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.2.0.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish v0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release metadata and frozen-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import tomllib
          import yaml

          root = pathlib.Path('.')
          pyproject = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          assert pyproject['project']['version'] == '0.2.0'
          assert pyproject['project']['urls']['Release'].endswith('/releases/tag/v0.2.0')

          citation = yaml.safe_load((root / 'CITATION.cff').read_text(encoding='utf-8'))
          assert citation['version'] == '0.2.0'
          assert str(citation['date-released']) == '2026-08-16'

          manifest = json.loads((root / 'docs/release-v0.2.0.json').read_text(encoding='utf-8'))
          assert manifest['release'] == 'v0.2.0'
          assert manifest['release_date'] == '2026-08-16'
          evidence = manifest['scientific_evidence']
          assert evidence['scientific_result_changed'] is False
          assert evidence['set_b_rerun'] is False
          assert evidence['set_c_used'] is False
          assert evidence['frozen_model_changed'] is False
          assert evidence['threshold_changed'] is False
          assert evidence['final_result_receipt'] == 'docs/final-result-receipt.json'

          receipt = root / evidence['final_result_receipt']
          receipt_bytes = receipt.read_bytes()
          # Git blob identity is recorded in the release manifest; verify it directly.
          blob_payload = f'blob {len(receipt_bytes)}\0'.encode() + receipt_bytes
          git_blob_sha = hashlib.sha1(blob_payload).hexdigest()
          assert git_blob_sha == evidence['final_result_receipt_git_blob_sha']

          frozen = json.loads(receipt.read_text(encoding='utf-8'))
          assert frozen['evaluation_status'] == 'final'
          assert frozen['evaluation']['set_b_final_evaluation_successes'] == 1
          assert frozen['evaluation']['final_lock_status'] == 'locked_after_one_success'
          assert frozen['metrics']['auprc'] == 0.5549611311053255
          assert frozen['model']['threshold'] == 0.2974276505509685
          PY

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v0.2.0 >/dev/null; then
            echo 'v0.2.0 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists; refusing to overwrite.' >&2
            exit 1
          fi

      - name: Create annotated v0.2.0 tag at this exact commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.0 "$GITHUB_SHA" -m "CareRisk 48H v0.2.0 — Trustworthiness & Research Software Closure"
          git push origin refs/tags/v0.2.0

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Overview

          Research-software hardening release. The frozen Set B scientific result remains unchanged.

          ## Scientific result — unchanged

          - Set B was not rerun.
          - Set C remains unused.
          - Frozen model, threshold, and reported metrics are unchanged.
          - `docs/final-result-receipt.json` remains the authoritative machine-readable scientific evidence.

          Frozen headline result:

          - AUPRC: 0.555 (95% CI 0.516–0.594)
          - AUROC: 0.870 (95% CI 0.855–0.884)
          - Brier: 0.087
          - ECE: 0.008
          - Sensitivity: 58.1%
          - Specificity: 90.9%
          - Research threshold: 0.297

          ## New in v0.2.0

          - Calibration and threshold stability diagnostics
          - Monitoring contracts
          - Abstention and inference guards
          - Synthetic-only safety demo improvements
          - TRIPOD+AI / PROBAST+AI evidence audit
          - CI, container, schema, and documentation hardening
          - Explicit release manifest separating software evolution from frozen scientific evidence

          ## Verification

          The release commit is gated by the repository CPU CI matrix (Python 3.10/3.11/3.12), Ruff, Mypy, Pytest on synthetic/mocked data, and Docker non-root launch-free smoke checks.

          ## Boundaries

          - Historical same-source ICU cohort
          - No external validation
          - No temporal or site-held-out validation
          - No prospective validation
          - No clinical utility study
          - Not a clinical decision-support system
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CareRisk 48H v0.2.0 — Trustworthiness & Research Software Closure" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
