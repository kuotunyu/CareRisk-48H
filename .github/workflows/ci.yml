name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: pip install -e ".[dev,tabular]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest (synthetic and mocked data only)
        env:
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python -m pytest -m "not integration and not slow"

  container:
    name: Docker non-root launch-free smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build source-only CPU image
        run: docker build --tag carerisk48h:ci .
      - name: Launch-free synthetic app smoke
        run: >-
          docker run --rm --cpus=2
          -e CUDA_VISIBLE_DEVICES=
          --entrypoint python
          carerisk48h:ci
          -c "import os; assert os.geteuid() != 0; from app.dashboard import create_app; app = create_app(); assert app is not None"
